apiVersion: v1
kind: ServiceAccount
metadata:
  name: exec-cron
  namespace: cloudbees-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exec-cron
  namespace: cloudbees-core
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exec-cron
  namespace: cloudbees-core
subjects:
  - kind: ServiceAccount
    name: exec-cron
    namespace: cloudbees-core
roleRef:
  kind: Role
  name: exec-cron
  apiGroup: rbac.authorization.k8s.io

